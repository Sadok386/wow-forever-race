<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://render.worldofwarcraft.com; media-src 'self'; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Suivi de la course au niveau maximum entre amis sur World of Warcraft: Forever.">
  <title>Course au niveau 60 · WoW Forever</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/chart.css">
  <link rel="stylesheet" href="assets/edit.css">
  <link rel="stylesheet" href="assets/intro.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <div class="page">
    <header class="site-header" id="header"></header>
    <main class="page__main" id="main" tabindex="-1">
      <noscript><p class="notice notice--warn">Ce site a besoin de JavaScript pour afficher la course.</p></noscript>
      <div class="stack" id="notices" hidden></div>
      <div id="state" hidden></div>
      <section class="section" id="race" aria-labelledby="race-title" hidden></section>
      <section class="section" id="waiting" aria-labelledby="waiting-title" hidden></section>
      <section class="section" id="progress" aria-labelledby="progress-title" hidden>
        <h2 class="section__title" id="progress-title">Progression</h2>
        <div id="chart"></div>
      </section>
      <section class="section" id="feed" aria-labelledby="feed-title" hidden></section>
    </main>
    <footer class="site-footer" id="footer"></footer>
  </div>
</body>
</html>
